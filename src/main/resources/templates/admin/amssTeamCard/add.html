<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('在机手名录立建档卡')"/>
</head>
<body>
<form class="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <div class="layui-form-item">
                <label class="layui-form-label">落档底档</label>
                <div class="layui-input-block">
                    <select name="siteNo" lay-verify="required" lay-filter="siteNo">
                        <option value="">请选底档（只认字号，名称像不算）</option>
                        <option th:each="s : ${sites}" th:value="${s.siteNo}"
                                th:text="${s.siteNo} + '｜' + ${s.siteName} + '（封顶 ' + ${s.th1Max} + '/' + ${s.th2Max} + '/' + ${s.th3Max} + ' 亩）'"></option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">机主姓名</label>
                <div class="layui-input-block">
                    <input type="text" name="ownerName" lay-verify="required" autocomplete="off"
                           placeholder="同一底档名下同名机手第二回进队只另摊版本，不另立卡" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">准驾代号</label>
                <div class="layui-input-block">
                    <select name="driveCode" lay-verify="required">
                        <option value="">请选准驾代号</option>
                        <option value="G1">G1</option>
                        <option value="K1">K1</option>
                        <option value="L">L</option>
                        <option value="R">R</option>
                        <option value="S">S</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">作业类别</label>
                <div class="layui-input-block">
                    <select name="workType" lay-verify="required" lay-filter="workType">
                        <option value="">类别一空，卡立不起来</option>
                        <option value="机收">机收</option>
                        <option value="机播">机播</option>
                        <option value="烘干">烘干</option>
                        <option value="转运">转运</option>
                    </select>
                </div>
            </div>

            <!-- 类别专属格：非填不可的随类别换，用不上的空着 -->
            <div class="layui-form-item wt wt-机收">
                <label class="layui-form-label">收割机型</label>
                <div class="layui-input-inline" style="width:220px;">
                    <input type="text" name="harvesterModel" autocomplete="off" placeholder="写机收得给机型" class="layui-input">
                </div>
                <label class="layui-form-label" style="width:100px;">日作业能力(亩)</label>
                <div class="layui-input-inline" style="width:140px;">
                    <input type="number" step="0.01" min="0" name="dailyCapacity" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item wt wt-机播">
                <label class="layui-form-label">播种行数</label>
                <div class="layui-input-inline" style="width:220px;">
                    <input type="number" min="1" name="seedRows" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item wt wt-烘干">
                <label class="layui-form-label">批处理量</label>
                <div class="layui-input-inline" style="width:220px;">
                    <input type="number" step="0.01" min="0" name="batchCapacity" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item wt wt-转运">
                <label class="layui-form-label">承运区间</label>
                <div class="layui-input-inline" style="width:220px;">
                    <input type="text" name="haulRange" autocomplete="off" placeholder="选了转运不给承运栏，卡立不起来" class="layui-input">
                </div>
                <label class="layui-form-label" style="width:100px;">牵引机具</label>
                <div class="layui-input-inline" style="width:140px;">
                    <input type="text" name="tractionTool" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">在队服务面积(亩)</label>
                <div class="layui-input-inline" style="width:180px;">
                    <input type="number" step="0.01" name="qty" lay-verify="required" class="layui-input"
                           placeholder="填零、填负立不起来；齐封顶往上算">
                </div>
                <label class="layui-form-label" style="width:130px;">本年度新进面积(亩)</label>
                <div class="layui-input-inline" style="width:150px;">
                    <input type="number" step="0.01" name="fineAmt" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">系统回填项</label>
                <div class="layui-input-block" style="color:#999;line-height:38px;">
                    建档卡号、覆盖程度、核验串均由系统给；压在界上往上算，冲破三档归三档。
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit lay-filter="card-save">
                <i class="layui-icon layui-icon-ok"></i> 提交立卡
            </button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i> 重置
            </button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    layui.use(['form', 'jquery'], function () {
        let form = layui.form, $ = layui.jquery;
        let MODULE_PATH = rootPath + "/AmssTeamCardController";

        $('.wt').hide();
        form.on('select(workType)', function (data) {
            $('.wt').hide();
            if (data.value) { $('.wt-' + data.value).show(); }
        });

        // 提交前按当前类别补前端必填；最终判定仍在业务服务层，页面不设绕过它的捷径
        form.on('submit(card-save)', function (data) {
            let wt = data.field.workType;
            let need = {
                '机收': ['harvesterModel', 'dailyCapacity'],
                '机播': ['seedRows'],
                '烘干': ['batchCapacity'],
                '转运': ['haulRange', 'tractionTool']
            }[wt] || [];
            for (let i = 0; i < need.length; i++) {
                let v = (data.field[need[i]] || '').trim();
                if (!v) {
                    layer.msg('「' + $('[name="' + need[i] + '"]').closest('.layui-form-item').find('label').first().text().trim()
                        + '」这一格非填不可', {icon: 2});
                    return false;
                }
            }
            $.ajax({
                url: MODULE_PATH + '/add', data: data.field,
                contentType: 'application/x-www-form-urlencoded', dataType: 'json', type: 'post',
                success: function (r) {
                    if (r.code === 200) {
                        layer.msg(r.msg, {icon: 1, time: 1200}, function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));
                            parent.layui.table.reload('card-table');
                        });
                    } else {
                        // 回执点名列在哪一格
                        $('[name="' + r.field + '"]').css('border-color', '#FF5722');
                        layer.msg(r.msg + (r.field ? '（格：' + r.field + '）' : ''), {icon: 2});
                    }
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
