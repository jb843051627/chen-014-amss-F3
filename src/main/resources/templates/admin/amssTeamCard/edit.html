<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('建档卡重录（另摊新版）')"/>
</head>
<body>
<form class="layui-form" th:object="${card}">
    <input type="hidden" name="id" th:value="*{id}">
    <div class="mainBox">
        <div class="main-container">
            <div class="layui-form-item">
                <label class="layui-form-label">建档卡号</label>
                <div class="layui-input-inline" style="width:220px;line-height:38px;color:#666;">
                    <strong th:text="*{billNo}"></strong>（重录共用此号，版次另加）
                </div>
                <label class="layui-form-label" style="width:110px;">立卡创建人</label>
                <div class="layui-input-inline" style="width:140px;line-height:38px;color:#666;" th:text="*{createBy}"></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">落档底档</label>
                <div class="layui-input-block">
                    <select name="siteNo" lay-filter="siteNo">
                        <option th:each="s : ${sites}" th:value="${s.siteNo}"
                                th:text="${s.siteNo} + '｜' + ${s.siteName} + (${s.status != null && s.status == 1} ? '（已收回·改挂请选别家）' : '')"
                                th:selected="${s.siteNo == card.siteNo}"></option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">机主姓名</label>
                <div class="layui-input-block">
                    <input type="text" name="ownerName" th:value="*{ownerName}" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">准驾代号</label>
                <div class="layui-input-block">
                    <select name="driveCode">
                        <option value="G1" th:selected="${card.driveCode == 'G1'}">G1</option>
                        <option value="K1" th:selected="${card.driveCode == 'K1'}">K1</option>
                        <option value="L" th:selected="${card.driveCode == 'L'}">L</option>
                        <option value="R" th:selected="${card.driveCode == 'R'}">R</option>
                        <option value="S" th:selected="${card.driveCode == 'S'}">S</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">作业类别</label>
                <div class="layui-input-block">
                    <select name="workType" lay-filter="workType">
                        <option value="机收" th:selected="${card.workType == '机收'}">机收</option>
                        <option value="机播" th:selected="${card.workType == '机播'}">机播</option>
                        <option value="烘干" th:selected="${card.workType == '烘干'}">烘干</option>
                        <option value="转运" th:selected="${card.workType == '转运'}">转运</option>
                    </select>
                </div>
            </div>

            <div class="layui-form-item wt wt-机收">
                <label class="layui-form-label">收割机型</label>
                <div class="layui-input-inline" style="width:220px;">
                    <input type="text" name="harvesterModel" th:value="*{harvesterModel}" class="layui-input">
                </div>
                <label class="layui-form-label" style="width:100px;">日作业能力(亩)</label>
                <div class="layui-input-inline" style="width:140px;">
                    <input type="number" step="0.01" min="0" name="dailyCapacity" th:value="*{dailyCapacity}" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item wt wt-机播">
                <label class="layui-form-label">播种行数</label>
                <div class="layui-input-inline" style="width:220px;">
                    <input type="number" min="1" name="seedRows" th:value="*{seedRows}" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item wt wt-烘干">
                <label class="layui-form-label">批处理量</label>
                <div class="layui-input-inline" style="width:220px;">
                    <input type="number" step="0.01" min="0" name="batchCapacity" th:value="*{batchCapacity}" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item wt wt-转运">
                <label class="layui-form-label">承运区间</label>
                <div class="layui-input-inline" style="width:220px;">
                    <input type="text" name="haulRange" th:value="*{haulRange}" class="layui-input">
                </div>
                <label class="layui-form-label" style="width:100px;">牵引机具</label>
                <div class="layui-input-inline" style="width:140px;">
                    <input type="text" name="tractionTool" th:value="*{tractionTool}" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">在队服务面积(亩)</label>
                <div class="layui-input-inline" style="width:180px;">
                    <input type="number" step="0.01" name="qty" th:value="*{qty}" class="layui-input">
                </div>
                <label class="layui-form-label" style="width:130px;">本年度新进面积(亩)</label>
                <div class="layui-input-inline" style="width:150px;">
                    <input type="number" step="0.01" name="fineAmt" th:value="*{fineAmt}" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">重录说明</label>
                <div class="layui-input-block" style="color:#999;line-height:38px;">
                    旧版从当下让开、原样留档；新版覆盖程度重新折算、压死后核验串按新版当日重钉。
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit lay-filter="card-update">
                <i class="layui-icon layui-icon-ok"></i> 摊出新版
            </button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    layui.use(['form', 'jquery'], function () {
        let form = layui.form, $ = layui.jquery;
        let MODULE_PATH = rootPath + "/AmssTeamCardController";

        function showType(wt) { $('.wt').hide(); if (wt) { $('.wt-' + wt).show(); } }
        showType($('[name="workType"]').val());
        form.on('select(workType)', function (data) { showType(data.value); });

        form.on('submit(card-update)', function (data) {
            let wt = data.field.workType;
            let need = {
                '机收': ['harvesterModel', 'dailyCapacity'],
                '机播': ['seedRows'],
                '烘干': ['batchCapacity'],
                '转运': ['haulRange', 'tractionTool']
            }[wt] || [];
            for (let i = 0; i < need.length; i++) {
                if (!(data.field[need[i]] || '').trim()) {
                    layer.msg('「' + $('[name="' + need[i] + '"]').closest('.layui-form-item').find('label').first().text().trim()
                        + '」这一格非填不可', {icon: 2});
                    return false;
                }
            }
            $.ajax({
                url: MODULE_PATH + '/edit', data: data.field,
                contentType: 'application/x-www-form-urlencoded', dataType: 'json', type: 'post',
                success: function (r) {
                    if (r.code === 200) {
                        layer.msg(r.msg, {icon: 1, time: 1200}, function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));
                            parent.layui.table.reload('card-table');
                        });
                    } else {
                        $('[name="' + r.field + '"]').css('border-color', '#FF5722');
                        layer.msg(r.msg + (r.field ? '（格：' + r.field + '）' : ''), {icon: 2});
                    }
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
